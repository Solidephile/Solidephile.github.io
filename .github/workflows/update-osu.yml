name: Update osu Stats


on:

  # 可以在 GitHub 网页上手动运行
  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-osu:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Update osu stats
        env:

          OSU_CLIENT_ID:
            ${{ secrets.OSU_CLIENT_ID }}

          OSU_CLIENT_SECRET:
            ${{ secrets.OSU_CLIENT_SECRET }}

          OSU_USERNAME:
            Solidephile

        run: |
          node scripts/update-osu.js


      - name: Commit updated data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/osu.json

          git diff --cached --quiet || \
            git commit -m "Update osu stats"

          git push