```yaml
name: Debug osu Stats and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout main
      # =========================

      - name: Checkout main
        uses: actions/checkout@v4


      # =========================
      # 2. Setup Node.js
      # =========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================
      # 3. Update osu stats
      # =========================

      - name: Update osu stats
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          OSU_USERNAME: Solidephile
          UPDATE_HISTORY: "false"
        run: |
          node scripts/update_osu.js


      # =========================
      # 4. Setup Pages
      # =========================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # =========================
      # 5. Upload website
      # =========================

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


  # =========================
  # 6. Deploy
  # =========================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
