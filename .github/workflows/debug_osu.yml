name: Debug osu Stats and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # =========================
  # Build
  # =========================

  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4


      # 2. Checkout osu_data (read only)
      - name: Checkout osu_data branch
        uses: actions/checkout@v4
        with:
          ref: osu_data
          path: osu_data_branch


      # 3. Copy history to main
      - name: Prepare osu history
        run: |
          mkdir -p data
          cp osu_data_branch/data/osu_history.json data/osu_history.json


      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # 5. Update osu stats
      - name: Update osu stats
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          OSU_USERNAME: Solidephile
          UPDATE_HISTORY: "false"
        run: |
          node scripts/update_osu.js


      # 6. Prepare Pages directory
      - name: Prepare website
        run: |
          rm -rf dist
          mkdir -p dist/data

          cp index.html dist/
          cp style.css dist/
          cp script.js dist/

          cp data/osu.json dist/data/osu.json
          cp data/osu_history.json dist/data/osu_history.json

          echo "=== Files to deploy ==="
          find dist -type f


      # 7. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # 8. Upload website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # =========================
  # Deploy
  # =========================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4