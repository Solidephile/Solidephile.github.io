name: Update osu Stats and Deploy


on:

  # 可以手动运行
  workflow_dispatch:

  # 每 6 小时运行一次
  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. 获取仓库代码
      - name: Checkout
        uses: actions/checkout@v4


      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # 3. 获取最新 osu 数据
      - name: Update osu stats
        env:

          OSU_CLIENT_ID:
            ${{ secrets.OSU_CLIENT_ID }}

          OSU_CLIENT_SECRET:
            ${{ secrets.OSU_CLIENT_SECRET }}

          OSU_USERNAME:
            Solidephile

        run: |
          node scripts/update-osu.js


      # 4. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # 5. 将整个网站打包
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      # 6. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4